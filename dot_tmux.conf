# 基础行为

# 使用 tmux 自己的 256 色终端描述，并为常见终端启用真彩色。
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",alacritty:RGB"

# 缩短 Esc 的识别延迟，改善 Vim/Neovim 中的模式切换体验。
set -sg escape-time 10
set -g focus-events on
set -g mouse on
set -g history-limit 100000

# 窗口和窗格都从 1 开始编号；关闭窗口后自动整理编号。
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# 允许终端标题显示当前窗口名称。
set -g set-titles on
set -g set-titles-string "tmux: #S:#I.#P #W"

# 窗口与分屏

# 新窗口和新窗格继承当前窗格的工作目录。
bind c new-window -c "#{pane_current_path}"
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 使用 Prefix + h/j/k/l 在窗格间移动。
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 使用 Prefix + H/J/K/L 连续调整窗格大小。
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 使用 Prefix + r 重新加载配置。
bind r source-file ~/.tmux.conf \; display-message "tmux 配置已重新加载"

# 复制模式

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# 状态栏

set -g status-position bottom
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g status-left " #[bold]#S "
set -g status-right " #H | %Y-%m-%d %H:%M "

set -g status-style "fg=colour250,bg=colour235"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style "fg=colour235,bg=colour214,bold"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour214"
set -g message-style "fg=colour235,bg=colour214"
